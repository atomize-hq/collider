<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collider Token Sync</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --fg: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --danger: #b91c1c;
        --ok: #047857;
        --btn: #111827;
        --btnFg: #ffffff;
        --btnDisabled: #9ca3af;
        --mono:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New',
          monospace;
      }

      body {
        margin: 0;
        padding: 12px;
        font:
          12px/1.4 system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }

      h1 {
        font-size: 13px;
        margin: 0 0 10px;
      }

      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      label {
        color: var(--muted);
        display: block;
        margin-bottom: 4px;
      }

      input[type='text'] {
        flex: 1;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
      }

      input[type='file'] {
        flex: 1;
      }

      button {
        padding: 8px 10px;
        border: 0;
        border-radius: 6px;
        background: var(--btn);
        color: var(--btnFg);
        cursor: pointer;
      }

      button[disabled] {
        background: var(--btnDisabled);
        cursor: not-allowed;
      }

      .hint {
        color: var(--muted);
        font-size: 11px;
      }

      .report {
        white-space: pre-wrap;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px;
        font-family: var(--mono);
        font-size: 11px;
      }

      .status-ok {
        color: var(--ok);
      }

      .status-bad {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <div class="stack">
      <h1>Collider Token Sync</h1>

      <div>
        <label for="url">Artifact URL</label>
        <div class="row">
          <input id="url" type="text" />
          <button id="fetch">Fetch</button>
        </div>
        <div class="hint">Default: local proof server on localhost:4173</div>
      </div>

      <div>
        <label for="file">Artifact File</label>
        <div class="row">
          <input id="file" type="file" accept="application/json" />
        </div>
        <div class="hint">Fallback when you can’t use the local server.</div>
      </div>

      <div class="row">
        <button id="sync" disabled>Sync Variables</button>
        <span id="summary" class="hint"></span>
      </div>

      <div id="report" class="report">Waiting for input…</div>

      <hr style="border: none; border-top: 1px solid var(--border); margin: 4px 0" />

      <div>
        <label>Pull from Figma</label>
        <div class="hint">
          Reads all variable collections from the current file and writes them to
          <code>design-tokens/src/tokens/</code> via the local server.
        </div>
      </div>

      <div class="row">
        <button id="pull">Pull from Figma</button>
        <span id="pull-summary" class="hint"></span>
      </div>

      <div id="pull-report" class="report" style="display: none"></div>
    </div>

    <script>
      const urlInput = document.getElementById('url');
      const fetchBtn = document.getElementById('fetch');
      const fileInput = document.getElementById('file');
      const syncBtn = document.getElementById('sync');
      const reportEl = document.getElementById('report');
      const summaryEl = document.getElementById('summary');

      let loadedJsonText = null;

      function send(message) {
        parent.postMessage({ pluginMessage: message }, '*');
      }

      function setReport(text, ok = null) {
        reportEl.textContent = text;
        reportEl.classList.remove('status-ok', 'status-bad');
        if (ok === true) reportEl.classList.add('status-ok');
        if (ok === false) reportEl.classList.add('status-bad');
      }

      function setSummary(text) {
        summaryEl.textContent = text;
      }

      function setReady(ready) {
        syncBtn.disabled = !ready;
      }

      fetchBtn.onclick = () => {
        loadedJsonText = null;
        setReady(false);
        setSummary('');
        setReport('Fetching…');
        send({ type: 'FETCH_URL', url: urlInput.value });
      };

      fileInput.onchange = async () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;
        loadedJsonText = await file.text();
        setReport(`Loaded ${file.name} (${file.size} bytes). Ready to sync.`);
        setReady(true);
        setSummary('Loaded from file');
      };

      syncBtn.onclick = () => {
        if (!loadedJsonText) {
          setReport('No artifact loaded yet.', false);
          return;
        }
        setReport('Syncing variables…');
        send({ type: 'SYNC', jsonText: loadedJsonText });
      };

      window.onmessage = (event) => {
        const msg = event.data && event.data.pluginMessage;
        if (!msg || typeof msg.type !== 'string') return;

        if (msg.type === 'DEFAULT_URL') {
          urlInput.value = msg.url;
          return;
        }

        if (msg.type === 'FETCH_OK') {
          loadedJsonText = msg.jsonText;
          setReady(true);
          setSummary(`Loaded from URL (${msg.byteCount} bytes)`);
          setReport('Artifact fetched. Ready to sync.');
          return;
        }

        if (msg.type === 'FETCH_ERROR') {
          loadedJsonText = null;
          setReady(false);
          setSummary('');
          setReport(msg.message || 'Fetch failed.', false);
          return;
        }

        if (msg.type === 'SYNC_REPORT') {
          const ok = Boolean(msg.ok);
          setReport(msg.report || (ok ? 'Sync succeeded.' : 'Sync failed.'), ok);
          if (!ok) setReady(true);
          return;
        }
      };

      // ── Pull from Figma ──────────────────────────────────────────
      const pullBtn = document.getElementById('pull');
      const pullReportEl = document.getElementById('pull-report');
      const pullSummaryEl = document.getElementById('pull-summary');
      const pullServerUrl = 'http://localhost:4173/figma/pull';

      function setPullReport(text, ok = null) {
        pullReportEl.style.display = 'block';
        pullReportEl.textContent = text;
        pullReportEl.classList.remove('status-ok', 'status-bad');
        if (ok === true) pullReportEl.classList.add('status-ok');
        if (ok === false) pullReportEl.classList.add('status-bad');
      }

      pullBtn.onclick = () => {
        pullBtn.disabled = true;
        pullSummaryEl.textContent = '';
        setPullReport('Reading variables from Figma…');
        send({ type: 'PULL' });
      };

      async function postDtcgToServer(dtcgJson, summary) {
        pullSummaryEl.textContent = summary;
        setPullReport(`Collected: ${summary}\nPosting to server…`);
        try {
          const res = await fetch(pullServerUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: dtcgJson,
          });
          const body = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
          if (res.ok) {
            const written = Array.isArray(body.written) ? body.written.join('\n  ') : '';
            const buildLine =
              body.buildStatus === 'ok'
                ? '✓ build:tokens succeeded'
                : `✗ build:tokens failed\n${body.buildOutput ?? ''}`;
            setPullReport(`Pull succeeded.\n\nFiles written:\n  ${written}\n\n${buildLine}`, true);
          } else {
            setPullReport(`Server error: ${body.error ?? res.statusText}`, false);
          }
        } catch (err) {
          setPullReport(
            `Could not reach server at ${pullServerUrl}.\nMake sure pnpm figma:tokens:serve is running.\n\n${err}`,
            false
          );
        } finally {
          pullBtn.disabled = false;
        }
      }

      // Extend existing onmessage handler
      const _prevOnMessage = window.onmessage;
      window.onmessage = (event) => {
        if (_prevOnMessage) _prevOnMessage(event);
        const msg = event.data && event.data.pluginMessage;
        if (!msg || typeof msg.type !== 'string') return;

        if (msg.type === 'PULL_RESULT') {
          postDtcgToServer(msg.dtcgJson, msg.summary);
          return;
        }

        if (msg.type === 'PULL_ERROR') {
          setPullReport(msg.message || 'Pull failed.', false);
          pullSummaryEl.textContent = '';
          pullBtn.disabled = false;
          return;
        }
      };

      send({ type: 'UI_READY' });
    </script>
  </body>
</html>
