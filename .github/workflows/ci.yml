name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.11.1'
  CARGO_TERM_COLOR: always
  REVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

# Token drift belongs in the governance job.
# Downstream jobs must consume pnpm govern:tokens through that single shared entrypoint
# instead of reimplementing token validation, build, or sync-ledger shell logic here.
jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_SHA }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pinned ds-skills and verify project discovery
        run: |
          echo "DS_SKILLS_PREFIX=$RUNNER_TEMP/ds-skills" >> "$GITHUB_ENV"
          DS_SKILLS_PREFIX="$RUNNER_TEMP/ds-skills" node .ds-skills/project.mjs --install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run token governance
        run: pnpm govern:tokens

  storybook-proof:
    name: Storybook Proof
    needs: governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_SHA }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pinned ds-skills and verify project discovery
        run: |
          echo "DS_SKILLS_PREFIX=$RUNNER_TEMP/ds-skills" >> "$GITHUB_ENV"
          DS_SKILLS_PREFIX="$RUNNER_TEMP/ds-skills" node .ds-skills/project.mjs --install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Storybook proof gate
        run: pnpm govern:storybook-proof

  quality:
    name: Quality
    needs: [governance, storybook-proof]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_SHA }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pinned ds-skills and verify project discovery
        run: |
          echo "DS_SKILLS_PREFIX=$RUNNER_TEMP/ds-skills" >> "$GITHUB_ENV"
          DS_SKILLS_PREFIX="$RUNNER_TEMP/ds-skills" node .ds-skills/project.mjs --install

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install CI tooling
        uses: taiki-e/install-action@v2
        with:
          tool: just,tokei

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static checks
        run: just check

      - name: Run LOC guards
        run: just loc

  test-all:
    name: Test All
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_SHA }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pinned ds-skills and verify project discovery
        run: |
          echo "DS_SKILLS_PREFIX=$RUNNER_TEMP/ds-skills" >> "$GITHUB_ENV"
          DS_SKILLS_PREFIX="$RUNNER_TEMP/ds-skills" node .ds-skills/project.mjs --install

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install CI tooling
        uses: taiki-e/install-action@v2
        with:
          tool: just,nextest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run automated tests
        run: just test-all

  build-next:
    name: Build Next.js
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_SHA }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pinned ds-skills and verify project discovery
        run: |
          echo "DS_SKILLS_PREFIX=$RUNNER_TEMP/ds-skills" >> "$GITHUB_ENV"
          DS_SKILLS_PREFIX="$RUNNER_TEMP/ds-skills" node .ds-skills/project.mjs --install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm build

  build-storybook:
    name: Build Storybook
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_SHA }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pinned ds-skills and verify project discovery
        run: |
          echo "DS_SKILLS_PREFIX=$RUNNER_TEMP/ds-skills" >> "$GITHUB_ENV"
          DS_SKILLS_PREFIX="$RUNNER_TEMP/ds-skills" node .ds-skills/project.mjs --install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Upload Storybook static build
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static-${{ env.REVIEW_SHA }}
          path: storybook-static
          if-no-files-found: error

  chromatic-review:
    name: chromatic-review
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    needs: build-storybook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_SHA }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pinned ds-skills and verify project discovery
        run: |
          echo "DS_SKILLS_PREFIX=$RUNNER_TEMP/ds-skills" >> "$GITHUB_ENV"
          DS_SKILLS_PREFIX="$RUNNER_TEMP/ds-skills" node .ds-skills/project.mjs --install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Storybook static build
        uses: actions/download-artifact@v4
        with:
          name: storybook-static-${{ env.REVIEW_SHA }}
          path: storybook-static

      - name: Publish branch-aware Chromatic review
        id: publish_chromatic_review
        continue-on-error: true
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          REVIEW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { readPinnedResult } from './.ds-skills/project.mjs';
          const { status, result } = readPinnedResult(
            ['chromatic', 'review', 'publish', '--config', 'ds-skills.project.json', '--branch', process.env.REVIEW_BRANCH],
            'chromatic review publish'
          );
          if (['written', 'unchanged'].includes(result.artifactStatus)) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'current_status=true\n');
          }
          process.stdout.write(JSON.stringify(result) + '\n');
          process.exitCode = status;
          JS

      - name: Validate current invocation's review status
        if: ${{ always() && steps.publish_chromatic_review.outputs.current_status == 'true' }}
        run: pnpm validate:chromatic-status --sha "$REVIEW_SHA"

      - name: Upload current invocation's review status
        if: ${{ always() && steps.publish_chromatic_review.outputs.current_status == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: chromatic-status-${{ env.REVIEW_SHA }}
          path: artifacts/chromatic/status.json
          if-no-files-found: error

      - name: Require a completed current publication
        if: ${{ always() && (steps.publish_chromatic_review.outcome != 'success' || steps.publish_chromatic_review.outputs.current_status != 'true') }}
        run: exit 1

  reusable-component-promotion:
    name: Reusable Component Promotion
    needs: chromatic-review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEW_SHA }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pinned ds-skills and verify project discovery
        run: |
          echo "DS_SKILLS_PREFIX=$RUNNER_TEMP/ds-skills" >> "$GITHUB_ENV"
          DS_SKILLS_PREFIX="$RUNNER_TEMP/ds-skills" node .ds-skills/project.mjs --install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download chromatic review status artifact
        uses: actions/download-artifact@v4
        with:
          name: chromatic-status-${{ env.REVIEW_SHA }}
          path: artifacts/chromatic

      - name: Generate current static story coverage
        run: pnpm govern:storybook-proof

      - name: Record current component evidence
        run: pnpm generate:reusable-component-status

      - name: Enforce the explicit component review policy
        run: pnpm govern:reusable-component-promotion --profile component-review --consumer ci

      - name: Upload reusable component promotion artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: reusable-component-status-${{ env.REVIEW_SHA }}
          path: artifacts/harness/reusable-component-status.json
          if-no-files-found: error
